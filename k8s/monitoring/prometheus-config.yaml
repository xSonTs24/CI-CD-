apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager:9093

    rule_files:
      - /etc/prometheus/alert_rules.yml

    scrape_configs:
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - microapp
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: (.+)
            replacement: $1

      - job_name: 'mysql-exporter-users'
        static_configs:
          - targets: ['mysql-exporter-users:9104']
            labels:
              namespace: microapp

      - job_name: 'mysql-exporter-products'
        static_configs:
          - targets: ['mysql-exporter-products:9104']
            labels:
              namespace: microapp

      - job_name: 'mysql-exporter-orders'
        static_configs:
          - targets: ['mysql-exporter-orders:9104']
            labels:
              namespace: microapp

  alert_rules.yml: |
    groups:
      - name: alertas-proyecto
        rules:
          - alert: ServicioCaido
            expr: up == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Servicio caído: {{ $labels.job }}"
              description: "{{ $labels.job }} lleva más de 1 minuto sin responder."

          - alert: CPUAlta
            expr: rate(container_cpu_usage_seconds_total[5m]) > 0.80
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "CPU alta en {{ $labels.job }}"
              description: "{{ $labels.job }} lleva 2 minutos con CPU > 80%."

          - alert: BuildFallido
            expr: increase(github_actions_run_failed_total[10m]) > 2
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: "Builds fallando consecutivamente"
              description: "Más de 2 builds fallidos en los últimos 10 minutos."

          - alert: MemoriaAlta
            expr: container_memory_usage_bytes / container_spec_memory_limit_bytes > 0.85
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Memoria alta en {{ $labels.job }}"
              description: "{{ $labels.job }} está usando más del 85% de su memoria."

          - alert: ErroresHTTPAltos
            expr: rate(flask_http_request_total{status="500"}[5m]) > 0.05
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Errores HTTP 500 en {{ $labels.job }}"
              description: "{{ $labels.job }} tiene tasa alta de errores 500."
