# Exporter para db-users
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-exporter-users
  namespace: microapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-exporter-users
  template:
    metadata:
      labels:
        app: mysql-exporter-users
    spec:
      containers:
        - name: exporter
          image: prom/mysqld-exporter:latest
          env:
            - name: MYSQLD_EXPORTER_PASSWORD
              value: "root"
          args:
            - --mysqld.address=db-users-svc:3306
            - --mysqld.username=root
          ports:
            - containerPort: 9104
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-exporter-users
  namespace: microapp
spec:
  selector:
    app: mysql-exporter-users
  ports:
    - port: 9104
      targetPort: 9104
---
