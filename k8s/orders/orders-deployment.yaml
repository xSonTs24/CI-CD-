apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-deployment
  namespace: microapp
spec:
  replicas: 2
  strategy: # estrategia
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
      annotations: # ← nuevo
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "5004"
    spec:
      containers:
        - name: orders  
          image: xsonts/microorders:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5004
          env:
            - name: CONSUL_HOST
              value: "consul-svc"
            - name: MYSQL_HOST
              value: "db-orders-svc"
            - name: MYSQL_USER
              value: "root"
            - name: MYSQL_PASSWORD
              value: "root"
            - name: MYSQL_DB
              value: "ordersdb"
          readinessProbe: # ← nuevo
            httpGet:
              path: /metrics
              port: 5004
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: orders-svc
  namespace: microapp
spec:
  selector:
    app: orders
  ports:
    - port: 5004
      targetPort: 5004
  type: ClusterIP
