apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: microapp
spec:
  replicas: 1
  strategy: # ← nuevo
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
      annotations: # ← nuevo
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "5001"
    spec:
      containers:
        - name: frontend
          image: xsonts/frontend:PLACEHOLDER_TAG
          imagePullPolicy: IfNotPresent # ← cambio
          ports:
            - containerPort: 5001
          env:
            - name: CONSUL_HOST
              value: "consul-svc"
            - name: SERVICE_NAME
              value: "front-service"
            - name: SERVICE_PORT
              value: "5001"
            - name: SERVICE_HOST
              value: "frontend"
          readinessProbe: # ← nuevo
            httpGet:
              path: /metrics
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: microapp
spec:
  selector:
    app: frontend
  ports:
    - port: 5001
      targetPort: 5001
  type: NodePort # ← este se queda igual, es correcto
