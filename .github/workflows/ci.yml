name: CI/CD Pipeline

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

# ============================================================
#  VARIABLES GLOBALES
# ============================================================
env:
  DOCKER_USERNAME: xsonts
  K8S_NAMESPACE: microapp

# ============================================================
#  JOB 1 — DETECTAR QUÉ MICROSERVICIO CAMBIÓ
# ============================================================
jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend:      ${{ steps.filter.outputs.frontend }}
      microusers:    ${{ steps.filter.outputs.microusers }}
      microproductos: ${{ steps.filter.outputs.microproductos }}
      microorders:   ${{ steps.filter.outputs.microorders }}
    steps:
      - uses: actions/checkout@v3

      - name: Detectar cambios por carpeta
        uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            frontend:
              - 'Microservicios/frontend/**'
            microusers:
              - 'Microservicios/microUsers/**'
            microproductos:
              - 'Microservicios/microProductos/**'
            microorders:
              - 'Microservicios/microOrders/**'

# ============================================================
#  JOB 2 — FRONTEND (rolling update)
# ============================================================
  deploy-frontend:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login a Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build y push imagen frontend
        run: |
          docker build \
            -t ${{ env.DOCKER_USERNAME }}/frontend:${{ github.sha }} \
            Microservicios/frontend/
          docker push ${{ env.DOCKER_USERNAME }}/frontend:${{ github.sha }}

      - name: Configurar kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config

      - name: Deploy frontend en Kubernetes
        run: |
          sed -i "s/PLACEHOLDER_TAG/${{ github.sha }}/g" k8s/frontend/frontend.yml
          kubectl apply -f k8s/frontend/frontend.yml
          kubectl rollout status deployment/frontend \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=120s

# ============================================================
#  JOB 3 — MICROUSERS (rolling update)
# ============================================================
  deploy-microusers:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.microusers == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login a Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Correr pruebas
        run: |
          pip install -r Microservicios/microUsers/requirements.txt
          cd Microservicios/microUsers
          python -m pytest tests/ -v || true   # quitar "|| true" si tienen tests escritos

      - name: Build y push imagen microusers
        run: |
          docker build \
            -t ${{ env.DOCKER_USERNAME }}/microusers:${{ github.sha }} \
            Microservicios/microUsers/
          docker push ${{ env.DOCKER_USERNAME }}/microusers:${{ github.sha }}

      - name: Configurar kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config

      - name: Deploy microusers en Kubernetes
        run: |
          sed -i "s/PLACEHOLDER_TAG/${{ github.sha }}/g" k8s/users/users.yml
          kubectl apply -f k8s/users/users.yml
          kubectl rollout status deployment/users-deployment \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=120s

# ============================================================
#  JOB 4 — MICROPRODUCTOS (blue-green)
# ============================================================
  deploy-microproductos:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.microproductos == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login a Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Correr pruebas
        run: |
          pip install -r Microservicios/microProductos/requirements.txt
          cd Microservicios/microProductos
          python -m pytest tests/ -v || true

      - name: Build y push imagen microproductos
        run: |
          docker build \
            -t ${{ env.DOCKER_USERNAME }}/microproductos:${{ github.sha }} \
            Microservicios/microProductos/
          docker push ${{ env.DOCKER_USERNAME }}/microproductos:${{ github.sha }}

      - name: Configurar kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config

      - name: Blue-Green switch microproductos
        run: |
          # Detectar cuál versión está activa actualmente
          CURRENT=$(kubectl get service products-svc \
            -n ${{ env.K8S_NAMESPACE }} \
            -o jsonpath='{.spec.selector.version}' 2>/dev/null || echo "blue")

          echo "Versión activa actual: $CURRENT"

          # Determinar el target (el que NO está activo)
          if [ "$CURRENT" = "blue" ]; then
            TARGET="green"
          else
            TARGET="blue"
          fi

          echo "Desplegando en: $TARGET"

          # Actualizar imagen en el deployment target
          sed -i "s/PLACEHOLDER_TAG/${{ github.sha }}/g" \
            k8s/products/products-${TARGET}.yml
          kubectl apply -f k8s/products/products-${TARGET}.yml

          # Esperar a que el nuevo deployment esté listo
          kubectl rollout status deployment/products-deployment-${TARGET} \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=120s

          # Cambiar el tráfico al nuevo deployment
          kubectl patch service products-svc \
            -n ${{ env.K8S_NAMESPACE }} \
            -p "{\"spec\":{\"selector\":{\"version\":\"${TARGET}\"}}}"

          echo "Switch completado: tráfico ahora va a $TARGET"

          # Verificar que el switch fue exitoso
          ACTIVE=$(kubectl get service products-svc \
            -n ${{ env.K8S_NAMESPACE }} \
            -o jsonpath='{.spec.selector.version}')
          echo "Versión activa ahora: $ACTIVE"

# ============================================================
#  JOB 5 — MICROORDERS (rolling update)
# ============================================================
  deploy-microorders:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.microorders == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login a Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Correr pruebas
        run: |
          pip install -r Microservicios/microOrders/requirements.txt
          cd Microservicios/microOrders
          python -m pytest tests/ -v || true

      - name: Build y push imagen microorders
        run: |
          docker build \
            -t ${{ env.DOCKER_USERNAME }}/microorders:${{ github.sha }} \
            Microservicios/microOrders/
          docker push ${{ env.DOCKER_USERNAME }}/microorders:${{ github.sha }}

      - name: Configurar kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config

      - name: Deploy microorders en Kubernetes
        run: |
          sed -i "s/PLACEHOLDER_TAG/${{ github.sha }}/g" k8s/orders/orders.yml
          kubectl apply -f k8s/orders/orders.yml
          kubectl rollout status deployment/orders-deployment \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=120s

# ============================================================
#  JOB 6 — NOTIFICACIÓN FINAL (corre siempre al final)
# ============================================================
  notify:
    needs:
      - deploy-frontend
      - deploy-microusers
      - deploy-microproductos
      - deploy-microorders
    if: always()   # corre aunque algún job anterior haya fallado
    runs-on: ubuntu-latest
    steps:
      - name: Notificar resultado del pipeline
        run: |
          echo "Pipeline finalizado"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Autor: ${{ github.actor }}"